[package]
name = "compact-vdisk"
version = "0.1.0"
description = "Cross-platform virtual disk compaction GUI tool"
authors = ["CompactVdisk Team"]
edition = "2021"

[lib]
name = "compact_vdisk_lib"
path = "src/lib.rs"

[[bin]]
name = "compact-vdisk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
tempfile = "3.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
